<!doctype html>
<html lang="fr"><head><meta charset="utf-8"/>
<style>
  :root{--bg:#0a0a0b;--card:#111113;--border:#262629;--muted:#8a8a90;--amber:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#ededed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:28px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px 24px;max-width:1000px}
  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .title{font-size:18px;font-weight:600}
  .hint{font-size:12px;color:var(--muted)}
  .row{display:flex;gap:24px}
  .chart{flex:1.7;min-width:0}
  .rank{flex:1;min-width:230px}
  .rank h4{margin:2px 0 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;transition:background .12s;cursor:default}
  .item:hover{background:#ffffff08}
  .item .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .item .nm{font-size:14px;color:#dfdfe4}
  .item .val{margin-left:auto;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
  .item .var{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;width:54px;text-align:center}
  .up{background:#22c55e1a;color:#4ade80}.down{background:#ef44441a;color:#f87171}
  svg{width:100%;height:auto;display:block}
</style></head>
<body>
<div class="card">
  <div class="top">
    <div class="title">Revenu net / nuitée</div>
    <div class="hint">6 derniers mois · classement du mois en cours</div>
  </div>
  <div class="row">
    <div class="chart"><div id="c"></div></div>
    <div class="rank"><h4>Classement (Mar 26)</h4><div id="rk"></div></div>
  </div>
</div>
<script>
const MONTHS=["Oct 25","Nov 25","Déc 25","Jan 26","Fév 26","Mar 26"];
const S=[
  {name:"Villa Cannes", color:"#22c55e", data:[210,220,225,230,222,235]},
  {name:"T3 Bastille",  color:"#3b82f6", data:[160,170,165,173,168,175]},
  {name:"T2 République",color:"#f59e0b", data:[105,110,108,110,112,109]},
  {name:"Loft Oberkampf",color:"#ef4444",data:[95,100,88,92,90,96]},
  {name:"Studio Marais",color:"#a855f7", data:[80,85,82,89,84,87]},
];
const W=640,H=300,M={l:48,r:54,t:18,b:34},PW=W-M.l-M.r,PH=H-M.t-M.b;
const min=0,max=260;
const xAt=i=>M.l+PW*i/(MONTHS.length-1);
const yAt=v=>M.t+PH-((v-min)/(max-min))*PH;
const NS="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox",`0 0 ${W} ${H}`);
// grid + y labels
[0,65,130,195,260].forEach(v=>{const y=yAt(v);s.appendChild(el("line",{x1:M.l,x2:W-M.r,y1:y,y2:y,stroke:"#26262980","stroke-dasharray":"3 5"}));
  const t=el("text",{x:M.l-10,y:y+4,fill:"#8a8a90","font-size":11,"text-anchor":"end"});t.textContent=v+"€";s.appendChild(t);});
MONTHS.forEach((m,i)=>{const t=el("text",{x:xAt(i),y:H-12,fill:"#8a8a90","font-size":11,"text-anchor":"middle"});t.textContent=m;s.appendChild(t);});
// lines + end dot + end label (direct labeling)
S.forEach(se=>{
  const d=se.data.map((v,i)=>(i?"L":"M")+xAt(i)+" "+yAt(v)).join(" ");
  s.appendChild(el("path",{d,fill:"none",stroke:se.color,"stroke-width":2.25,opacity:.92,"stroke-linecap":"round","stroke-linejoin":"round"}));
  const lx=xAt(MONTHS.length-1),ly=yAt(se.data[se.data.length-1]);
  s.appendChild(el("circle",{cx:lx,cy:ly,r:3.5,fill:se.color}));
  const t=el("text",{x:lx+8,y:ly+4,fill:se.color,"font-size":11,"font-weight":600});t.textContent=se.data[se.data.length-1]+"€";s.appendChild(t);
});
document.getElementById("c").appendChild(s);
// ranked list (sorted desc by current month) with variation vs previous month
const rk=document.getElementById("rk");
[...S].sort((a,b)=>b.data[5]-a.data[5]).forEach(se=>{
  const cur=se.data[5],prev=se.data[4],pct=Math.round((cur-prev)/prev*100);
  const up=pct>=0;
  const it=document.createElement("div");it.className="item";
  it.innerHTML=`<span class="dot" style="background:${se.color}"></span>
    <span class="nm">${se.name}</span>
    <span class="val">${cur}€</span>
    <span class="var ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(pct)}%</span>`;
  rk.appendChild(it);
});
</script>
</body></html>
